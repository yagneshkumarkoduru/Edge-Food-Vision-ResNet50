name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy matplotlib

      - name: Bytecode Syntax Compilation Check
        run: |
          python -m compileall implementations/

      - name: Run Tier 2 Conformal Risk Prediction Engine
        run: |
          python implementations/v2_conformal_risk_calibration/conformal_prediction_engine.py

      - name: Run Tier 2 Pruning-Aware Quantization Benchmark
        run: |
          python implementations/v2_conformal_risk_calibration/pruning_aware_quantization.py

      - name: Run Tier 3 Dynamic Early Exit Benchmark
        run: |
          python implementations/v3_dynamic_exit_test_time_adaptation/dynamic_exit_benchmark.py
